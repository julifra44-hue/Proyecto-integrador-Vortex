          <label class="login-label" for="usuario">Usuario</label>
          <input type="text" id="usuario" class="form-control login-input mb-3" placeholder="Usuario" autocomplete="username" required>
          <label class="login-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-control login-input mb-4" placeholder="Contraseña" autocomplete="current-password" required>
          <button class="btn btn-neon w-100" type="button" onclick="login()">Ingresar</button>
        </div>

    </div>
