<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#160a22">
    <title>Panel de Administración | Vortex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --admin-bg: #12091b;
            --admin-panel: #1c1028;
            --admin-line: #603779;
            --admin-neon: #ca5cff;
            --admin-text: #f8efff;
            --admin-muted: #bca8cb;
        }
        body {
            min-height: 100vh;
            color: var(--admin-text);
            background: radial-gradient(ellipse at top right, #35114c 0, var(--admin-bg) 48rem);
        }
        .admin-nav {
            background: rgba(17, 8, 26, 0.94);
            border-bottom: 1px solid rgba(202, 92, 255, 0.5);
            box-shadow: 0 4px 24px rgba(146, 41, 190, 0.2);
        }
        .admin-brand { color: var(--admin-text); font-weight: 800; }
        .admin-brand span { color: #e18aff; text-shadow: 0 0 14px #bd40ff; }
        .admin-container { max-width: 1120px; padding-top: 6.5rem; padding-bottom: 3rem; }
        .admin-eyebrow { color: var(--admin-neon); font-size: 0.75rem; font-weight: 800; letter-spacing: 0.12em; }
        .admin-title { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 800; }
        .admin-copy { color: var(--admin-muted); }
        .admin-toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .btn-neon {
            color: #fff;
            background: #8d24c7;
            border: 1px solid #db8aff;
            font-weight: 800;
            box-shadow: 0 0 16px rgba(183, 57, 255, 0.25);
        }
        .btn-neon:hover, .btn-neon:focus-visible { color: #fff; background: #a333df; }
        .btn-logout { color: #f3ddff; border-color: #764c8d; }
        .btn-logout:hover { color: #fff; background: #392047; border-color: #b87ad3; }
        #listaJuegos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 1rem;
        }
        #listaJuegos > .card {
            color: var(--admin-text) !important;
            background: var(--admin-panel) !important;
            border: 1px solid var(--admin-line) !important;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .admin-empty {
            grid-column: 1 / -1;
            padding: 2rem;
            color: var(--admin-muted);
            text-align: center;
            border: 1px dashed var(--admin-line);
            border-radius: 8px;
            background: rgba(28, 16, 40, 0.62);
        }
        @media (max-width: 575px) {
            .admin-container { padding-top: 5.5rem; }
            .admin-toolbar .btn { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <nav class="navbar admin-nav fixed-top">
        <div class="container">
            <a class="navbar-brand admin-brand" href="index.html"><span>⚡</span> VORTEX GAME VAULT</a>
            <span class="small text-uppercase text-secondary">Administración</span>
        </div>
    </nav>

    <main class="container admin-container">
        <header class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
            <div>
                <p class="admin-eyebrow mb-2">CONTROL DE TIENDA</p>
                <h1 class="admin-title mb-2">Panel de administración</h1>
                <p class="admin-copy mb-0">Gestiona los juegos disponibles en el catálogo.</p>
            </div>
            <div class="admin-toolbar">
                <button class="btn btn-neon" type="button" onclick="agregarJuego()">+ Agregar juego</button>
                <button class="btn btn-outline-light btn-logout" type="button" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </header>

        <section aria-label="Lista de juegos">
            <div id="listaJuegos">
                <div class="admin-empty">Todavía no hay juegos agregados.</div>
            </div>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
