<!DOCTYPE html>

<head>

    }
    .input-group .form-control {

    }

        padding-right: 18px !important;

        border-color: #ffffff !important;
    }

        width: 280px;

        object-fit: contain;
        transform: scale(2);
    }
    .offcanvas-header .btn-close {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
